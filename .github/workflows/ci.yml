name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  calidad:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: ./gradlew lintDevDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-lint
          path: app/build/reports/lint-results-devDebug.html
          retention-days: 7

  pruebas:
    name: Pruebas unitarias (JUnit) con cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: ./gradlew testDevDebugUnitTest createDevDebugUnitTestCoverageReport
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-mobile
          path: |
            app/build/reports/coverage/
            app/build/reports/tests/
          retention-days: 7

  build:
    name: Build (APK dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: ./gradlew assembleDevDebug
      - uses: actions/upload-artifact@v7
        with:
          name: apk-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 7

  # Análisis de calidad y cobertura. No forma parte de ci-gate: informa, no bloquea el merge.
  sonarqube:
    name: SonarQube Cloud
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Sin token, se omite el análisis
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::No hay SONAR_TOKEN disponible (por ejemplo, en un PR de Dependabot). Se omite el análisis."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0  # la historia completa permite detectar el código nuevo
      - name: Descargar el reporte de cobertura de JaCoCo
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: cobertura-mobile
          path: app/build/reports
      - name: Ubicar el XML de JaCoCo
        id: jacoco
        if: env.SONAR_TOKEN != ''
        run: |
          XML=$(find app/build/reports/coverage -name '*.xml' | head -n 1)
          if [ -z "$XML" ]; then echo "::warning::No se encontró el XML de JaCoCo; el análisis irá sin cobertura."; fi
          echo "xml=$XML" >> "$GITHUB_OUTPUT"
      - name: Análisis en SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ steps.jacoco.outputs.xml }}

  # Único check obligatorio en la regla de protección de main.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [calidad, pruebas, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Al menos un job falló o se canceló."
            exit 1
          fi
          echo "Todos los jobs pasaron."
