# Versión de Android que simula Robolectric en las pruebas unitarias. 34 es la más reciente que
# corre con Java 17, el de la CI (36 y 37 exigen Java 21 o no están soportadas todavía).
sdk=34
# Las pruebas corren en español, el idioma por defecto; las de inglés usan @Config(qualifiers = "en").
qualifiers=es
